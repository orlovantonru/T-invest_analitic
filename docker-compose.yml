# Прод-стек: web (Node: статика + /api + /auth) за caddy (TLS Let's Encrypt +
# reverse-proxy). Наружу опубликован только caddy (80/443); web слушает во
# внутренней сети. Обе службы читают .env.production (web — секреты, caddy — APP_DOMAIN).
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env.production          # TINVEST_TOKEN, SESSION_SECRET, APP_PASSWORD_HASH
    expose: ["8787"]                   # internal only — reached via caddy, never published
    networks: [edge]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: .env.production          # needs APP_DOMAIN (Caddyfile reads {$APP_DOMAIN})
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [edge]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
